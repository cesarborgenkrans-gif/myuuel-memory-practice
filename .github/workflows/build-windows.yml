# Builds the portable Windows app on GitHub's own machines, straight from the code in this repository,
# and signs a build-provenance attestation, so anyone can check that a download was made here and from what.
#
#   Push a tag such as v0.1.1   -> builds, attests and opens a draft release with the .exe and SHA256SUMS.txt
#   Actions tab -> Run workflow -> builds and attests only (the .exe is kept as a workflow artifact)
#
# Verify a download:  gh attestation verify Myuuel-Memory-Practice-Windows-x64.exe --repo cesarborgenkrans-gif/myuuel-memory-practice
name: Build Windows app

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write      # create the draft release
  id-token: write      # sign the attestation
  attestations: write  # store the attestation

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build portable .exe
        run: npx electron-builder --win portable --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Checksum
        shell: pwsh
        run: |
          $exe = 'release-dist/Myuuel-Memory-Practice-Windows-x64.exe'
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  Myuuel-Memory-Practice-Windows-x64.exe" | Out-File -Encoding ascii release-dist/SHA256SUMS.txt
          Get-Content release-dist/SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release-dist/Myuuel-Memory-Practice-Windows-x64.exe

      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: Myuuel-Memory-Practice-Windows-x64
          path: |
            release-dist/Myuuel-Memory-Practice-Windows-x64.exe
            release-dist/SHA256SUMS.txt

      - name: Draft release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            release-dist/Myuuel-Memory-Practice-Windows-x64.exe
            release-dist/SHA256SUMS.txt
