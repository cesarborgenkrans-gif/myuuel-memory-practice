<html lang="en">

<title>Myuuel Memory Practice · SparkleSnap</title>
<meta name="description" content="A calm memory training app for your side screen. Myuuel shows a fictional password-style combination with a memory trick, lets it fade, and you recall it while you work. Free for Windows, fully offline.">
<meta property="og:title" content="Myuuel Memory Practice">
<meta property="og:description" content="A calm memory training app for your side screen. Fictional passwords only, fully offline. By SparkleSnap.">

<!--
  This page is the live stage behind Myuuel's card in SparkleSnap's Interactive Studio (embedded with ?embed),
  and a small page of its own at sparklesnap.dev/myuuel-memory-practice/.
  Everything on it is the app's own code, unchanged: the Living Type painter (scene-type.js), the practice engine
  and its fictional combinations (practice.js, combos.js), the confetti, the click sounds, and the motion kit
  drawing the approved Cross-Legged Calm Breathing sheet. Only the timing is shortened for a teaser.
-->
<style>
  @font-face { font-family: "Cascadia Mono"; src: url("fonts/cascadia-mono-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "Cascadia Mono"; src: url("fonts/cascadia-mono-latin-600-normal.woff2") format("woff2"); font-weight: 600; font-display: swap; }
  :root {
    --u: min(1vw, 1.5vh);
    --ink: #f7f2fa; --muted: #d8d3e0; --dim: #a9a6b6;
    --pink: #ec86c2; --pink-hi: #f4a8d4; --blue: #82b2fa; --amber: #ffb15c; --mint: #9fe2c0;
    --serif: "Noto Serif JP", "Yu Mincho", Georgia, serif;
    --label: "Space Mono", Consolas, "Courier New", monospace;
    --mono: "Cascadia Mono", Consolas, "Courier New", monospace;
    --spring: cubic-bezier(.34, 1.56, .5, 1);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #090b12; color: var(--ink); font-family: var(--serif); -webkit-tap-highlight-color: transparent; }
  body { cursor: url("art/cursor-96.svg") 12 12, default; user-select: none; }
  body.pressing { cursor: url("art/cursor-active-96.svg") 12 12, default; }
  canvas { display: block; }
  #scene { position: fixed; left: 0; top: 0; width: 100%; height: 100%; filter: brightness(1.3) contrast(1.08) saturate(1.1); } /* the sphere has to read at card size, as in the README banner */
  #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }

  /* ── Myuuel ── */
  .figure { position: fixed; right: 1.5%; bottom: -3%; height: 102%; aspect-ratio: 3 / 4; z-index: 2; transform-origin: 50% 90.6%; }
  .figure canvas { width: 100%; height: 100%; opacity: 0; transition: opacity .9s ease; }
  .figure.ready canvas { opacity: 1; }
  .figure.boop { animation: boop .5s var(--spring); }
  .figure.glow canvas { filter: drop-shadow(0 0 calc(var(--u) * 2.2) rgba(236,134,194,.85)); transition: filter .3s, opacity .9s; }
  @keyframes boop { 0% { transform: scale(1, 1); } 30% { transform: scale(1.014, .984); } 100% { transform: scale(1, 1); } }
  .bubble { position: fixed; z-index: 4; max-width: calc(var(--u) * 34); padding: calc(var(--u) * 1.3) calc(var(--u) * 2.2); border-radius: calc(var(--u) * 2);
            background: #f7f2fa; color: #111522; font: 600 calc(var(--u) * 2.9)/1.3 var(--serif);
            box-shadow: 0 calc(var(--u) * 1) calc(var(--u) * 3) rgba(0,0,0,.5), 0 0 0 calc(var(--u) * .3) rgba(236,134,194,.6);
            opacity: 0; transform: translateY(calc(var(--u) * 1.2)) scale(.92); transition: opacity .25s, transform .4s var(--spring); pointer-events: none; }
  .bubble.in { opacity: 1; transform: none; }
  .hint { position: fixed; z-index: 3; right: 4%; bottom: 5%; padding: calc(var(--u) * .9) calc(var(--u) * 1.8); border-radius: 99px;
          border: 1px dashed rgba(236,134,194,.55); background: rgba(9,11,18,.62); color: var(--pink-hi);
          font: 700 calc(var(--u) * 2.05)/1 var(--label); letter-spacing: .16em; text-transform: uppercase; pointer-events: none;
          opacity: 0; transform: translateY(6px); transition: opacity .6s, transform .6s var(--spring); }
  .hint.in { opacity: 1; transform: none; animation: hint-breathe 3.2s ease-in-out infinite; }
  @keyframes hint-breathe { 50% { border-color: rgba(236,134,194,.95); box-shadow: 0 0 calc(var(--u) * 2) rgba(236,134,194,.35); } }

  /* ── the practice card (the app's Living Type panel, scaled for a teaser) ── */
  .card { position: fixed; z-index: 3; left: 5%; top: 50%; width: 58%; transform: translateY(-50%);
          padding: calc(var(--u) * 3) calc(var(--u) * 3.4) calc(var(--u) * 3.2); border-radius: calc(var(--u) * 2.4);
          background: rgba(14,17,28,.8); border: calc(var(--u) * .15) solid rgba(247,242,250,.13);
          box-shadow: 0 calc(var(--u) * 2) calc(var(--u) * 7) rgba(0,0,0,.45); backdrop-filter: blur(2px); }
  .card::before { content: ""; position: absolute; left: 8%; right: 8%; top: 0; height: calc(var(--u) * .25); background: linear-gradient(90deg, transparent, var(--blue), var(--pink), transparent); }
  .card::after { content: ""; position: absolute; inset: calc(var(--u) * 1); border: 1px dashed rgba(247,242,250,.1); border-radius: calc(var(--u) * 1.6); pointer-events: none; }
  .row { display: flex; align-items: baseline; gap: calc(var(--u) * 1.6); }
  .phase { font: 700 calc(var(--u) * 2.6)/1 var(--label); letter-spacing: .22em; text-transform: uppercase; color: var(--pink); transition: color .4s; }
  .method { flex: 1; min-width: 0; font: 700 calc(var(--u) * 1.75)/1.2 var(--label); letter-spacing: .2em; text-transform: uppercase; color: var(--blue);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: opacity .5s; }
  .pips { font-size: calc(var(--u) * 2.2); letter-spacing: .1em; white-space: nowrap; }
  .pip { color: rgba(236,134,194,.28); transition: color .4s, text-shadow .4s; }
  .pip[data-views="1"] { color: rgba(236,134,194,.45); } .pip[data-views="2"] { color: rgba(236,134,194,.62); }
  .pip.current { color: var(--pink-hi); text-shadow: 0 0 calc(var(--u) * 1.6) rgba(236,134,194,.8); }
  .progress { height: calc(var(--u) * .5); margin: calc(var(--u) * 1.6) 0 calc(var(--u) * .4); border-radius: 99px; background: rgba(247,242,250,.08); overflow: hidden; }
  .progress i { display: block; height: 100%; transform-origin: left; transform: scaleX(0); background: linear-gradient(90deg, var(--blue), var(--pink)); }
  body[data-phase="recall"] .progress i { background: linear-gradient(90deg, var(--mint), var(--blue)); }
  .stage { position: relative; height: calc(var(--u) * 14); display: grid; place-items: center; }
  .combo { font: 400 calc(var(--u) * 8.4)/1.1 var(--mono); white-space: pre; font-variant-ligatures: none; transition: opacity .5s, filter .5s, transform .6s var(--spring); }
  .combo.out { opacity: 0; filter: blur(calc(var(--u) * 1.2)); transform: scale(.94); }
  .ch { display: inline-block; color: var(--ink); text-shadow: 0 0 .16em rgba(130,178,250,.2); transition: opacity .9s ease, transform 1.1s cubic-bezier(.2,.7,.2,1), color .5s; }
  .ch.d { color: var(--blue); } .ch.s { color: var(--amber); }
  .ch.m { color: var(--pink) !important; opacity: 0; transform: translate(var(--sx, 0), var(--sy, 0)) rotate(var(--sr, 0deg)); }
  body[data-phase="check"] .combo:not(.out) { animation: bloom .9s var(--spring); }
  @keyframes bloom { 0% { transform: scale(.94); text-shadow: 0 0 0 rgba(236,134,194,0); } 40% { transform: scale(1.05); } 100% { transform: scale(1); } }
  .prompt { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; opacity: 0; transform: translateY(calc(var(--u) * 1)); transition: opacity .6s, transform .6s; }
  .prompt.in { opacity: 1; transform: none; }
  .prompt span { font: italic 400 calc(var(--u) * 3.2)/1.35 var(--serif); color: var(--ink); max-width: 92%; }
  .prompt b { display: block; font: 700 calc(var(--u) * 4)/1 var(--label); color: var(--pink); margin-bottom: calc(var(--u) * 1); text-shadow: 0 0 calc(var(--u) * 4) rgba(236,134,194,.55); }
  .hintline { min-height: 2.7em; margin: calc(var(--u) * .6) 0 0; font: italic 400 calc(var(--u) * 2.35)/1.35 var(--serif); color: var(--muted); text-align: center; transition: opacity .5s; }
  .gone { opacity: 0 !important; } .quiet { opacity: .35; }
  .fiction { position: fixed; z-index: 3; left: 5%; bottom: 4.5%; font: 700 calc(var(--u) * 1.6)/1.3 var(--label); letter-spacing: .14em; text-transform: uppercase; color: rgba(247,242,250,.42); }
  .fiction::before { content: "✳ "; color: var(--amber); }

  /* ── the standalone page (sparklesnap.dev/myuuel-memory-practice/): a top bar with the way home and the download ── */
  .bar { display: none; }
  body.full { --u: min(.8vw, 1.25vh); }
  body.full .bar { position: fixed; z-index: 6; left: 0; right: 0; top: 0; display: flex; align-items: center; gap: 16px; padding: 18px 28px; }
  body.full .card { top: 54%; width: min(54%, 720px); left: 6%; }
  .bar a { color: var(--ink); text-decoration: none; }
  .bar .home img { height: 30px; display: block; filter: drop-shadow(0 0 8px rgba(130,178,250,.3)); }
  .bar .title { font: 600 clamp(15px, 1.6vw, 22px)/1.1 var(--serif); letter-spacing: .02em; }
  .bar .title small { display: block; font: 700 10px/1.4 var(--label); letter-spacing: .2em; text-transform: uppercase; color: var(--pink); }
  .bar .grow { flex: 1; }
  .bar .btn { display: inline-flex; align-items: center; gap: 8px; min-height: 42px; padding: 0 18px; border-radius: 99px; font: 700 12px/1 var(--label); letter-spacing: .08em; text-transform: uppercase;
              border: 1px solid rgba(247,242,250,.22); background: rgba(14,17,28,.72); transition: transform .3s var(--spring), background .3s; }
  .bar .btn:hover, .bar .btn:focus-visible { transform: translateY(-2px); background: rgba(29,34,51,.9); }
  .bar .btn.primary { background: linear-gradient(160deg, var(--pink-hi), var(--pink)); color: #170d18; border-color: #f7c3e1; box-shadow: 0 0 24px rgba(236,134,194,.32); }
  .bar .btn:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
  @media (max-width: 720px) {
    body.full { --u: min(1.5vw, 1.1vh); }
    body.full .bar { flex-wrap: wrap; padding: 14px 16px; gap: 10px; }
    body.full .bar .grow { display: none; }
    body.full .card { left: 4%; right: 4%; width: auto; top: 30%; }
    body.full .figure { height: 62%; right: 50%; transform: translateX(50%); }
  }
  /* A phone-width card: a little larger type, a wider card. */
  @media (max-width: 480px) { body:not(.full) { --u: min(1.25vw, 1.8vh); } body:not(.full) .card { left: 4%; width: 62%; } body:not(.full) .fiction { display: none; } }
  @media (prefers-reduced-motion: reduce) {
    .ch, .combo, .prompt, .bubble, .hint { transition: none !important; animation: none !important; }
    .ch.m { transform: none; }
  }
</style>

<body data-phase="intro">
<canvas id="scene" aria-hidden="true"></canvas>

<header class="bar">
  <a class="home" href="https://sparklesnap.dev/interactive-studio/" aria-label="SparkleSnap Interactive Studio"><img src="art/sparklesnap-watermark-v1-web.webp" alt="SparkleSnap"></a>
  <div class="title"><small>Memory practice</small>Myuuel</div>
  <span class="grow"></span>
  <a class="btn" href="https://github.com/cesarborgenkrans-gif/myuuel-memory-practice" target="_blank" rel="noreferrer">Source <span aria-hidden="true">↗</span></a>
  <a class="btn primary" href="https://github.com/cesarborgenkrans-gif/myuuel-memory-practice/releases/latest" target="_blank" rel="noreferrer">Free for Windows <span aria-hidden="true">↗</span></a>
</header>

<main class="card" id="card" aria-label="A practice round with a fictional combination" aria-live="off">
  <div class="row"><span class="phase" id="phase">Hello</span><span class="method" id="method"></span><span class="pips" id="pips" aria-hidden="true"></span></div>
  <div class="progress" aria-hidden="true"><i id="fill"></i></div>
  <div class="stage">
    <div class="combo out" id="combo"></div>
    <div class="prompt" id="prompt"><span><b>✳</b><em id="prompt-text"></em></span></div>
  </div>
  <p class="hintline" id="hintline"></p>
</main>
<p class="fiction">Fictional combinations only</p>

<div class="figure" id="figure"><canvas id="me" aria-hidden="true"></canvas></div>
<div class="bubble" id="bubble" role="status"></div>
<div class="hint" id="hint" aria-hidden="true">Poke her</div>
<canvas id="confetti" aria-hidden="true"></canvas>

<script src="kit/modules/myuuel-dress-wind.js"></script>
<script src="kit/modules/myuuel-smooth-motion.js"></script>
<script src="kit/modules/myuuel-audio-motion.js"></script>
<script src="kit/rig/motion-registration.js"></script>
<script src="kit/rig/myuuel-motion-profiles.js"></script>
<script src="kit/modules/myuuel-character.js"></script>
<script src="js/seated-registration.js"></script>
<script src="js/scene-type.js"></script>
<script src="js/combos.js"></script>
<script src="js/practice.js"></script>
<script src="js/confetti.js"></script>
<script src="js/sound.js"></script>
<script>
(async () => {
  'use strict';
  const $ = id => document.getElementById(id);
  const body = document.body;
  const embed = new URLSearchParams(location.search).has('embed') || window.top !== window;
  if (!embed) body.classList.add('full');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ── the night sky: the app's Living Type painter ── */
  const scene = MyuuelTypeScene.create($('scene'), { reduced });
  const figure = $('figure');
  // The painter sizes its letters and wire from a 9:16 screen. On this wide stage it paints a taller field (only the
  // top of it shows, like the README banner) so the sphere's characters stay readable instead of shrinking to dots.
  function withHeight(h, fn) {
    const own = Object.getOwnPropertyDescriptor(window, 'innerHeight');
    Object.defineProperty(window, 'innerHeight', { get: () => h, configurable: true });
    try { fn(); } finally { if (own) Object.defineProperty(window, 'innerHeight', own); else delete window.innerHeight; }
  }
  function layout() {
    const f = figure.getBoundingClientRect(), c = $('card').getBoundingClientRect();
    const floorY = f.top + f.height * 464 / 512, bandH = f.height * .62;
    const tall = Math.round(Math.max(innerHeight, innerWidth * 1.5));
    $('scene').style.height = tall + 'px';
    withHeight(tall, () => scene.resize({ cx: f.left + f.width / 2, floorY, bandTop: floorY - bandH, bandH, panel: { left: c.left, right: c.right, top: c.top, bottom: c.bottom } }));
  }
  addEventListener('resize', layout);
  layout(); scene.setMood('intro');

  /* ── Myuuel: the approved Cross-Legged Calm Breathing sheet, breathing through the kit's spring ── */
  const ID = '15-cross-legged-calm';
  const sheet = (await (await fetch('kit/approved-sheets.json')).json()).find(s => s.id === ID);
  const image = await new Promise((ok, no) => { const im = new Image(); im.onload = () => ok(im); im.onerror = no; im.src = 'kit/' + sheet.image.split('/').map(encodeURIComponent).join('/'); });
  const phrase = sheet.durations.map((ms, i) => [i, Math.round(ms * 1.15)]);
  const registration = { ...(window.MyuuelRegistration || {}), ...(window.MyuuelSeatedRegistration || {}) };
  const me = MyuuelCharacter.create($('me'), { registration, profiles: { [ID]: { beats: phrase } }, sizes: window.MyuuelSheetScale || null, reducedMotion: reduced });
  me.configure({ wind: true, windStrength: .7, motion: !reduced });
  me.audio.begin('output', 'life');
  me.setSheet(sheet, image);
  figure.classList.add('ready');

  const smooth = x => x * x * (3 - 2 * x);
  const life = { phase: 0, period: 4500, b: 0, impulses: [] };
  let clock = 0;
  function breathe(dt) {
    life.phase = (life.phase + dt / life.period) % 1;
    const p = life.phase; life.b = p < .4 ? smooth(p / .4) : 1 - smooth((p - .4) / .6);
    let v = .007 + .03 * (1 - life.b);
    life.impulses = life.impulses.filter(i => clock - i.at < i.ms);
    for (const i of life.impulses) v = Math.max(v, i.amp * (1 - (clock - i.at) / i.ms * .35));
    if (!reduced) me.audio.sample('output', 'life', v);
    scene.setBreath(life.b);
  }

  /* ── one practice round after another: the app's engine and its fictional combinations ── */
  const settings = { mode: 'lantern', speed: 'comfortable', level: 'gentle', style: 'mix', selfCheck: false, sound: true, theme: 'type' };
  // A teaser keeps every phase but shortens the waiting: Recall 12 s → 4 s, Rest 5 s → 2 s.
  const PACE = { intro: 1.6, look: 1, fade: 1, recall: 3, check: 1.25, rest: 2.5 };
  const LABEL = { intro: 'Hello', look: 'Look', fade: 'Fade', recall: 'Recall', check: 'Check', rest: 'Rest' };
  const confetti = MyuuelConfetti.create($('confetti'));
  let spans = [], shown = null;
  function renderCombo(value) {
    shown = value;
    spans = [...value].map(c => {
      const s = document.createElement('span'); s.className = 'ch ' + MyuuelCombos.classOf(c); s.textContent = c;
      s.style.setProperty('--sx', ((Math.random() - .5) * 1.8).toFixed(2) + 'em');
      s.style.setProperty('--sy', ((Math.random() - .65) * 1.6).toFixed(2) + 'em');
      s.style.setProperty('--sr', ((Math.random() - .5) * 120).toFixed(0) + 'deg');
      return s;
    });
    $('combo').replaceChildren(...spans); fit();
  }
  function fit() {
    const combo = $('combo'), box = combo.parentElement.getBoundingClientRect();
    if (!spans.length || !box.width) return;
    combo.style.fontSize = ''; const natural = combo.getBoundingClientRect().width;
    const base = parseFloat(getComputedStyle(combo).fontSize);
    if (natural > box.width * .96) combo.style.fontSize = (base * box.width * .96 / natural).toFixed(1) + 'px';
  }
  addEventListener('resize', fit);
  const applyMask = set => spans.forEach((s, i) => s.classList.toggle('m', !!set && set.has(i)));
  const show = (el, state) => { el.classList.toggle('gone', state === 'gone'); el.classList.toggle('quiet', state === 'quiet'); };
  function method(item, state) {
    if (item) {
      const round = (item.views || 0) + 1;
      $('method').textContent = (item.methodName || '') + (round > 1 ? ` · round ${Math.min(round, 3)} of 3` : '');
      $('hintline').textContent = item.hint || '';
    }
    show($('method'), state); show($('hintline'), state);
  }
  function prompt(text) { if (text) $('prompt-text').textContent = text; $('prompt').classList.toggle('in', !!text); }
  const combo = on => $('combo').classList.toggle('out', !on);

  function onPhase(e) {
    body.dataset.phase = e.phase;
    $('phase').textContent = LABEL[e.phase];
    scene.setMood(e.phase);
    // The Studio card lights its own Look · Fade · Recall · Check steps in time with this stage.
    if (window.parent !== window) try { window.parent.postMessage({ source: 'myuuel-teaser', phase: e.phase }, location.origin); } catch {}
    switch (e.phase) {
      case 'intro': renderCombo(e.item.value); combo(false); prompt('A quiet moment to practise.'); method(null, 'gone'); break;
      case 'look': if (e.item.value !== shown) renderCombo(e.item.value); applyMask(null); combo(true); prompt(null); method(e.item, 'show'); break;
      case 'fade': combo(true); prompt(null); method(e.item, 'show'); break;
      case 'recall': combo(false); prompt(e.item.recall); method(e.item, 'quiet'); break;
      case 'check':
        applyMask(null); combo(true); prompt(null); method(e.item, 'show'); scene.ring();
        if (visible) requestAnimationFrame(() => confetti.burst('type', $('combo').getBoundingClientRect()));
        break;
      case 'rest': combo(false); prompt(['No hurry.', 'Breathe in… and out.', 'Little by little.', 'Nice and steady.'][Math.floor(Math.random() * 4)]); method(null, 'gone'); break;
    }
  }
  function onDeck(d) {
    $('pips').replaceChildren(...Array.from({ length: d.size }, (_, i) => {
      const s = document.createElement('span'); s.className = 'pip' + (i === d.current ? ' current' : ''); s.dataset.views = Math.min(2, d.views[i]); s.textContent = '★'; return s;
    }));
  }
  const engine = MyuuelPractice.create({ settings, onPhase, onMask: m => applyMask(m), onDeck });
  engine.start();

  /* ── play: poke Myuuel, tap the sky ── */
  const sound = MyuuelSound;
  const POKE = ['Oh! Hi.', 'Hehe.', 'That tickles!', 'Okay, okay — I’m awake!', 'You’re a little bit silly.', 'Back to practice?'];
  let pokes = 0, lastPoke = -1e9, bubbleTimer = null, played = false;
  function onHer(x, y) {
    const r = figure.getBoundingClientRect();
    return x > r.left + r.width * .22 && x < r.right - r.width * .22 && y > r.top + r.height * .2 && y < r.top + r.height * .93;
  }
  function say(text) {
    const b = $('bubble'), r = figure.getBoundingClientRect();
    b.textContent = text; b.style.right = (innerWidth - r.left - r.width * .38) + 'px'; b.style.top = (r.top + r.height * .1) + 'px';
    b.classList.add('in'); clearTimeout(bubbleTimer); bubbleTimer = setTimeout(() => b.classList.remove('in'), 1900);
  }
  function poke(x, y) {
    if (clock - lastPoke > 8000) pokes = 0;
    lastPoke = clock; pokes++;
    sound.poke(pokes);
    life.impulses.push({ at: clock, amp: Math.min(.45, .22 + .04 * Math.min(pokes, 5)), ms: 130 });
    figure.classList.remove('boop'); void figure.offsetWidth; figure.classList.add('boop');
    say(POKE[Math.min(pokes, POKE.length) - 1]);
    if (pokes >= 4) { scene.puff(x, y, 16); scene.ring(); figure.classList.add('glow'); setTimeout(() => figure.classList.remove('glow'), 1500); }
    else scene.puff(x, y, 8);
    if (pokes >= POKE.length) pokes = 0;
  }
  addEventListener('pointerdown', e => {
    body.classList.add('pressing'); played = true; $('hint').classList.remove('in');
    if (e.target.closest('a')) return;
    if (onHer(e.clientX, e.clientY)) poke(e.clientX, e.clientY);
    else { scene.puff(e.clientX, e.clientY, 14); sound.twinkle(); }
  });
  addEventListener('pointerup', () => body.classList.remove('pressing'));
  setTimeout(() => { if (!played) $('hint').classList.add('in'); }, 5200);

  /* ── run only while the stage is on screen (the Studio page scrolls past it) ── */
  let visible = true, last = null, sceneAcc = 1000;
  if ('IntersectionObserver' in window) new IntersectionObserver(es => { visible = es[0].isIntersecting; last = null; }).observe(body);
  document.addEventListener('visibilitychange', () => { last = null; });
  function frame(now) {
    requestAnimationFrame(frame);
    if (!visible || document.hidden) return;
    const dt = last === null ? 0 : Math.min(100, now - last); last = now;
    clock += dt;
    engine.tick(dt * (PACE[engine.phase] || 1));
    $('fill').style.transform = `scaleX(${engine.progress().toFixed(4)})`;
    breathe(dt);
    me.update(Math.min(dt, 60));
    sceneAcc += dt;
    if (sceneAcc >= 33) { scene.frame(Math.min(sceneAcc, 100)); sceneAcc = 0; }
  }
  if (reduced) scene.redraw();
  requestAnimationFrame(frame);
  document.fonts?.ready.then(fit);
})();
</script>
</body>
</html>
